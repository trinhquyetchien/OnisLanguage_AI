<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whisper AI Local</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="Whisper transcriber">
        <div class="panel upload-panel">
          <div>
            <p class="eyebrow">Local Whisper AI</p>
            <h1>Chuyen am thanh hoac video tieng Nhat thanh van ban</h1>
          </div>

          <form id="uploadForm" class="upload-form">
            <label class="drop-zone" for="fileInput">
              <input id="fileInput" type="file" accept="audio/*,video/*" required />
              <span class="upload-icon" aria-hidden="true">↑</span>
              <span class="drop-title">Chon file de transcribe</span>
              <span id="fileName" class="drop-subtitle">Ho tro file audio va video</span>
            </label>

            <button id="submitButton" type="submit">Bat dau chuyen doi</button>
          </form>

          <div id="status" class="status" role="status">San sang nhan file.</div>

          <div id="mediaPreview" class="media-preview" hidden>
            <audio id="audioPlayer" controls></audio>
            <video id="videoPlayer" controls playsinline></video>
          </div>
        </div>

        <div class="panel result-panel">
          <div class="result-header">
            <div>
              <p class="eyebrow">Ket qua</p>
              <h2>Van ban nhan dang</h2>
            </div>
            <button id="copyButton" type="button" disabled>Copy</button>
          </div>

          <div id="transcriptList" class="transcript-list">
            <p class="empty-result">Ket qua se hien thi tai day sau khi backend xu ly xong.</p>
          </div>

          <div id="meta" class="meta"></div>

          <section class="analysis-panel" aria-label="Japanese analysis">
            <div class="analysis-header">
              <p class="eyebrow">Phan tich tieng Nhat</p>
              <h2>Tu loai va cach doc</h2>
            </div>
            <div id="tokenList" class="token-list">
              <p class="empty-result">Token, tu loai va furigana se hien thi sau khi xu ly.</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
